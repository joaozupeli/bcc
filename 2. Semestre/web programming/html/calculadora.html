<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade JS</title>
</head>
<body>
    <h1>Atividade</h1>

    <p>Valor 1:</p>
    <input type="number" id="n1">

    <p>Valor 2:</p>
    <input type="number" id="n2">

    <br><br>
    <button onclick="maior()">Qual é o maior</button>
    <p id="resultado"></p>

    <button onclick="somar()">Somar</button>
    <button onclick="subtrair()">Subtrair</button>
    <button onclick="multiplicar()">Multiplicar</button>
    <button onclick="dividir()">Dividir</button>

    <br><br>
    <button onclick="limpar()">Limpar</button>

    <script>
        function maior() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);

            if (n1 > n2) {
                document.getElementById("resultado").innerHTML = n1 + " é maior";
                document.getElementById("resultado").style.color = "green";
            } else if (n2 > n1) {
                document.getElementById("resultado").innerHTML = n2 + " é maior";
                document.getElementById("resultado").style.color = "blue";
            } else {
                document.getElementById("resultado").innerHTML = "Os dois são iguais";
                document.getElementById("resultado").style.color = "black";
            }
        }

        function somar() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);
            alert(n1 + n2);
        }

        function subtrair() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);
            alert(n1 - n2);
        }

        function multiplicar() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);
            alert(n1 * n2);
        }

        function dividir() {
            var n1 = Number(document.getElementById("n1").value);
            var n2 = Number(document.getElementById("n2").value);
            alert(n1 / n2);
        }

        function limpar() {
            document.getElementById("n1").value = "";
            document.getElementById("n2").value = "";
            document.getElementById("resultado").innerHTML = "";
        }
    </script>
</body>
</html>
